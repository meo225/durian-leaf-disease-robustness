# Benchmark suy giảm chất lượng ảnh (task 4.1).
# Mỗi họ có ba mức, tăng dần từ nhẹ đến mạnh. Giá trị chọn theo mẫu ảnh và điểm reference model trên validation.
# group plan: bốn họ của plan (độ sáng, tương phản, mờ, nhiễu). group extension: tình huống chụp ngoài vườn.
# locked: true nghĩa là đã khóa. Code từ chối mở tập test khi chưa khóa. Sau khi khóa không chỉnh theo kết quả test.

version: 3
locked: true
seed: 42

families:
  brightness_dark:
    type: brightness
    levels: [0.7, 0.5, 0.3]
  brightness_bright:
    type: brightness
    levels: [1.3, 1.6, 2.0]
  contrast_low:
    type: contrast
    levels: [0.7, 0.5, 0.3]
  blur:
    type: blur
    levels: [0.5, 1.0, 2.0]
  noise:
    type: noise
    levels: [0.03, 0.06, 0.10]
  contrast_high:
    group: extension
    type: contrast
    levels: [1.5, 2.2, 3.0]
  glare:
    group: extension
    type: glare
    levels: [0.4, 0.7, 1.0]
  shadow:
    group: extension
    type: shadow
    levels: [0.4, 0.7, 1.0]
  lowlight:
    group: extension
    type: lowlight
    levels: [0.7, 0.5, 0.35]
  motion_blur:
    group: extension
    type: motion_blur
    levels: [3, 5, 9]
  sensor_noise:
    group: extension
    type: sensor_noise
    levels: [250, 120, 60]
  jpeg:
    group: extension
    type: jpeg
    levels: [50, 25, 10]
  lowres:
    group: extension
    type: lowres
    levels: [0.75, 0.6, 0.45]
  color_cast:
    group: extension
    type: color_cast
    levels: [0.15, 0.3, 0.45]
