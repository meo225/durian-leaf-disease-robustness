# Cấu hình train ResNet-50. Checkpoint chọn theo macro F1 trên validation. Không đọc tập test.

pipeline_config: configs/pipeline.yaml
model_name: resnet50
library: timm
backbone: resnet50
pretrained: true
epochs: 20
patience: 5
min_delta: 0.0
learning_rate: 0.0001
weight_decay: 0.0001
optimizer: adamw
scheduler: none
selection_metric: macro_f1
