# Đo độ bền của ResNet-50, ConvNeXt-Tiny và Swin-Tiny huấn luyện với seed 43, cùng quy trình của configs/reference_selection.yaml.
# Chỉ đọc validation, không mở tập test. Không dùng để chọn lại reference model.
# `seed` bên dưới là seed của phép đo (nhiễu ngẫu nhiên của suy giảm), giữ 42 như lần đo gốc để mọi model gặp cùng ảnh hỏng.

pipeline_config: configs/pipeline.yaml
seed: 42
models:
  - configs/train_resnet50_seed43.yaml
  - configs/train_convnext_tiny_seed43.yaml
  - configs/train_swin_tiny_seed43.yaml
checkpoint_name: "{model_name}_seed43.pt"
recorded_result: "reports/baselines/{model_name}/{model_name}_seed43.json"
output: reports/baselines/reference_selection_seed43.json

latency:
  warmup: 20
  runs: 100
  batch_sizes: [1, 32]

close_margin: 0.01

corruptions:
  brightness_dark: {type: brightness, value: 0.5}
  brightness_bright: {type: brightness, value: 1.5}
  contrast_low: {type: contrast, value: 0.5}
  blur: {type: blur, value: 2.0}
  noise: {type: noise, value: 0.1}
