# Đo Swin-Tiny cạnh ba baseline bằng đúng quy trình của configs/reference_selection.yaml (task 3.3).
# Chạy lại cả bốn model để cùng một lần đo trên cùng validation và cùng năm suy giảm. Không train lại, không mở tập test.
# Kết quả ghi sang file riêng, không ghi đè reports/baselines/reference_selection.json. Reference model vẫn là ConvNeXt-Tiny.
# Phần "selection" trong file kết quả cho biết quy tắc đã khóa sẽ chọn gì khi có thêm Swin-Tiny, chỉ để tham khảo.

pipeline_config: configs/pipeline.yaml
seed: 42
models:
  - configs/train_resnet50.yaml
  - configs/train_convnext_tiny.yaml
  - configs/train_mobilenetv3_small.yaml
  - configs/train_swin_tiny.yaml
checkpoint_name: "{model_name}_seed42.pt"
recorded_result: "reports/baselines/{model_name}/{model_name}_seed42.json"
output: reports/baselines/reference_selection_with_swin.json

latency:
  warmup: 20
  runs: 100
  batch_sizes: [1, 32]

close_margin: 0.01

corruptions:
  brightness_dark: {type: brightness, value: 0.5}
  brightness_bright: {type: brightness, value: 1.5}
  contrast_low: {type: contrast, value: 0.5}
  blur: {type: blur, value: 2.0}
  noise: {type: noise, value: 0.1}
