# Chọn reference model (task 3.3). Dùng các checkpoint đã train, không train lại.
# Chỉ đọc tập validation. Mức suy giảm dưới đây chỉ cho sanity check, không phải severity cuối của task 4.1.

pipeline_config: configs/pipeline.yaml
seed: 42
models:
  - configs/train_resnet50.yaml
  - configs/train_convnext_tiny.yaml
  - configs/train_mobilenetv3_small.yaml
checkpoint_name: "{model_name}_seed42.pt"
recorded_result: "reports/baselines/{model_name}/{model_name}_seed42.json"
output: reports/baselines/reference_selection.json

latency:
  warmup: 20
  runs: 100
  batch_sizes: [1, 32]

# Các model có macro F1 sạch trong khoảng này so với model cao nhất được coi là ngang nhau.
# Giữa các model ngang nhau, chọn model có mức giảm F1 dưới suy giảm thấp nhất.
# Nếu mức giảm cũng chênh dưới khoảng này, chọn model có độ trễ batch 1 thấp hơn.
close_margin: 0.01

corruptions:
  brightness_dark: {type: brightness, value: 0.5}
  brightness_bright: {type: brightness, value: 1.5}
  contrast_low: {type: contrast, value: 0.5}
  blur: {type: blur, value: 2.0}
  noise: {type: noise, value: 0.1}
