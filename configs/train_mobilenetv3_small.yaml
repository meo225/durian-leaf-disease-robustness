# Cấu hình train MobileNetV3-Small. Cùng giao thức với mọi baseline khác, chỉ khác model.
# Checkpoint chọn theo macro F1 trên validation. Không đọc tập test.

pipeline_config: configs/pipeline.yaml
model_name: mobilenetv3_small
library: timm
backbone: mobilenetv3_small_100
pretrained: true
epochs: 30
patience: 7
min_delta: 0.0
learning_rate: 0.0002
weight_decay: 0.01
optimizer: adamw
scheduler: cosine
selection_metric: macro_f1
